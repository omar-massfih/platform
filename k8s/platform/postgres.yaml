# CloudNativePG Postgres for the ingest / dlt data platform.
#
# The operator (CRDs + controller in namespace cnpg-system) is installed
# out-of-band by the Ansible `cnpg_operator` role in 20-platform. This manifest
# only declares the database, and Flux reconciles it. On a fresh cluster it will
# error until the operator's CRDs exist — Flux retries, so it self-heals once
# 20-platform has run (same pattern as the cert-manager ClusterIssuer).
#
# CNPG auto-creates the app credentials in Secret `pg-app` (keys: username,
# password, dbname, host, port, uri, jdbc-uri). Nothing sensitive is committed.
# In-cluster read/write endpoint: pg-rw.platform.svc.cluster.local:5432
# (pg-ro / pg-r exist too for read-only / any-instance reads.)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 1                       # single-node k3s — one instance, no HA
  primaryUpdateStrategy: unsupervised # image omitted → operator's default Postgres major

  storage:
    size: 5Gi
    storageClass: local-path         # k3s default provisioner (RWO, node-local)

  # 512Mi was too light: silver's trips merge — ~500k rows deduplicated on a
  # three-column key, through dlt's staging tables — pushed postgres past it
  # and the kernel OOM-killed the database mid-load. The ingest pod was fine
  # throughout (no restarts, 3Gi untouched); the limit was on the wrong
  # component. This database is shared with the notes backend, so taking it
  # down costs more than a failed run.
  #
  # The node has ~9Gi free. shared_buffers stays at 128MB deliberately: the
  # OOM came from work memory during the merge, not from the buffer cache, and
  # raising shared_buffers would lift the floor rather than the ceiling.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "100"

  bootstrap:
    initdb:
      database: ingest
      owner: ingest
