# Runs the dlt pipeline from the `ingest` repo against the platform Postgres.
#
# This is the deployment glue: the ingest code is platform-agnostic and only reads
# a Postgres DSN from DESTINATION__POSTGRES__CREDENTIALS. Here we inject that from
# the CNPG `pg-app` Secret (`uri` key) and put it on a schedule. A CronJob (not a
# bare Job) so Flux can manage it declaratively and re-runs are idempotent; trigger
# an ad-hoc run with:  kubectl -n platform create job --from=cronjob/ingest ingest-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
spec:
  schedule: "0 3 * * *"              # daily 03:00 UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr
          containers:
            - name: ingest
              image: ghcr.io/omar-massfih/ingest
              imagePullPolicy: Always
              command: ["python", "run.py"]
              env:
                - name: DLT_DESTINATION
                  value: postgres
                - name: DESTINATION__POSTGRES__CREDENTIALS
                  valueFrom:
                    secretKeyRef:
                      name: pg-app        # CNPG-generated app creds
                      key: uri
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
