# The Dagster daemon from the `ingest` repo: it fires the schedules built from
# pipelines/*.yaml and executes the runs. Scheduling lives in those YAMLs, not
# here. Uses the image's default CMD (dagster-daemon run).
#
# Runs execute as subprocesses of this pod, not in pods of their own, so this
# container's memory limit is what bounds them. That is deliberate at one
# replica; a K8sRunLauncher would give each run its own pod and its own limit,
# and is the next step if runs start competing.
#
# Credentials are injected from Secrets; the ingest code stays platform-agnostic.
#
# No blanket DLT_DESTINATION override: bronze writes Parquet to Garage and
# silver reads it back into Postgres, so the two layers target different
# destinations. An override here would force both onto one and silently break
# whichever it is not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels: { app: ingest }
spec:
  replicas: 1
  strategy:
    type: Recreate                  # one daemon only — two would double-fire schedules
  selector:
    matchLabels: { app: ingest }
  template:
    metadata:
      labels: { app: ingest }
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: ingest
          image: ghcr.io/omar-massfih/ingest
          imagePullPolicy: Always
          env:
            - name: DESTINATION__POSTGRES__CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: pg-app        # CNPG-generated app creds
                  key: uri
            # Frost API http_basic auth: client id = username, empty password.
            # dlt resolves the bare CREDENTIALS__* section for rest_api sources;
            # destination creds above are more specific and take precedence.
            - name: CREDENTIALS__USERNAME
              valueFrom:
                secretKeyRef:
                  name: frost
                  key: FROST_CLIENT_ID
            - name: CREDENTIALS__PASSWORD
              value: ""
            # dagster's own run/event/schedule storage — see dagster.yaml in
            # the image. Its database is created by database.yaml alongside.
            - name: DAGSTER_PG_HOST
              valueFrom: { secretKeyRef: { name: pg-app, key: host } }
            - name: DAGSTER_PG_USERNAME
              valueFrom: { secretKeyRef: { name: pg-app, key: username } }
            - name: DAGSTER_PG_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-app, key: password } }
            - name: DAGSTER_PG_DB
              value: dagster
            # bronze writes Parquet to Garage (DESTINATION__), silver reads it
            # back (SOURCES__) — two dlt config namespaces, one bucket.
            - name: DESTINATION__FILESYSTEM__BUCKET_URL
              value: s3://ingest-landing
            - name: DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL
              value: http://garage.platform.svc.cluster.local:3900
            - name: DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_SECRET_KEY
            - name: SOURCES__FILESYSTEM__BUCKET_URL
              value: s3://ingest-landing
            - name: SOURCES__FILESYSTEM__CREDENTIALS__ENDPOINT_URL
              value: http://garage.platform.svc.cluster.local:3900
            - name: SOURCES__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_SECRET_KEY
          resources:
            # bysykkel_trips_bronze pulls three ~88 MB JSON month files through
            # rest_api, which holds each response in memory. Measured peak RSS
            # for the real 3-month run: 1.88 GiB (one month alone: 1.64 GiB).
            # 256Mi OOMKilled it six times; the headroom is for July/August
            # being larger than the June file that was measured.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 3Gi
