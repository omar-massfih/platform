# Long-running orchestrator from the `ingest` repo: one process that fires each
# pipeline in sources/*.yaml on its own cron `schedule`. Scheduling lives in the
# source YAMLs, not here. Uses the image's default CMD (python orchestrator.py).
# Credentials are injected from Secrets; the ingest code stays platform-agnostic.
#
# No blanket DLT_DESTINATION override here (deliberately) — sources/weather.yaml
# now has pipelines on two different destinations (postgres and filesystem), and
# a global override would force both onto one, silently breaking the other. Each
# pipeline's own `destination:` field in its YAML is authoritative.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels: { app: ingest }
spec:
  replicas: 1
  strategy:
    type: Recreate                  # single scheduler — never run two (double-fires)
  selector:
    matchLabels: { app: ingest }
  template:
    metadata:
      labels: { app: ingest }
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: ingest
          image: ghcr.io/omar-massfih/ingest
          imagePullPolicy: Always
          env:
            - name: DESTINATION__POSTGRES__CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: pg-app        # CNPG-generated app creds
                  key: uri
            # Frost API http_basic auth: client id = username, empty password.
            # dlt resolves the bare CREDENTIALS__* section for rest_api sources;
            # destination creds above are more specific and take precedence.
            - name: CREDENTIALS__USERNAME
              valueFrom:
                secretKeyRef:
                  name: frost
                  key: FROST_CLIENT_ID
            - name: CREDENTIALS__PASSWORD
              value: ""
            # weather_landing writes here (DESTINATION__), weather_raw reads it
            # back (SOURCES__) — two separate dlt config namespaces, same bucket.
            - name: DESTINATION__FILESYSTEM__BUCKET_URL
              value: s3://ingest-landing
            - name: DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL
              value: http://garage.platform.svc.cluster.local:3900
            - name: DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_SECRET_KEY
            - name: SOURCES__FILESYSTEM__BUCKET_URL
              value: s3://ingest-landing
            - name: SOURCES__FILESYSTEM__CREDENTIALS__ENDPOINT_URL
              value: http://garage.platform.svc.cluster.local:3900
            - name: SOURCES__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: GARAGE_DEFAULT_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
