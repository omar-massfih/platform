# The Dagster UI. It loads the code location to render the asset graph and run
# history, but never executes a pipeline.
#
# It still needs the Frost client id, which is not obvious: dagster-dlt builds
# every DltSource at *definition* time, and rest_api_source resolves
# `auth: http_basic` eagerly, so weather's credential is required just to draw
# the graph. It needs nothing else — no Postgres destination DSN, no Garage
# keys — because those resolve when a pipeline runs, which the UI never does.
#
# Deliberately ClusterIP with no Ingress. The Dagster webserver ships no
# authentication, and this cluster's other hosts are public behind Traefik.
# Reach it with:
#
#   kubectl -n platform port-forward svc/ingest-webserver 3000:3000
#
# Putting it on a hostname means putting an unauthenticated control plane —
# one that can launch runs — on the internet. That needs an auth middleware
# first, not just an Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-webserver
  labels: { app: ingest-webserver }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ingest-webserver }
  template:
    metadata:
      labels: { app: ingest-webserver }
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: webserver
          image: ghcr.io/omar-massfih/ingest
          imagePullPolicy: Always
          # no -w: the code location comes from [tool.dagster] in
          # /app/pyproject.toml, which dagster discovers from the working dir
          command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: DAGSTER_PG_HOST
              valueFrom: { secretKeyRef: { name: pg-app, key: host } }
            - name: DAGSTER_PG_USERNAME
              valueFrom: { secretKeyRef: { name: pg-app, key: username } }
            - name: DAGSTER_PG_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-app, key: password } }
            - name: DAGSTER_PG_DB
              value: dagster
            # see the note above: needed to build the source, not to run it
            - name: CREDENTIALS__USERNAME
              valueFrom: { secretKeyRef: { name: frost, key: FROST_CLIENT_ID } }
            - name: CREDENTIALS__PASSWORD
              value: ""
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-webserver
spec:
  selector: { app: ingest-webserver }
  ports:
    - { name: http, port: 3000, targetPort: http }
