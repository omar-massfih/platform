# Public at https://auth.omarmassfih.no. It has to be reachable from a browser:
# OIDC works by redirecting the person here and back, so this is not an internal
# service even though only other services talk to its token endpoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [auth.omarmassfih.no]
      secretName: keycloak-tls
  rules:
    - host: auth.omarmassfih.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { name: http }
