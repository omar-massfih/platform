parent=base
styles=css/signin.css
locales=en

# base's template.ftl carries no viewport meta of its own — without this the
# phone lays the page out at desktop width and then shrinks it to fit, so
# everything arrives zoomed out. base does emit whatever `meta` declares here
# (name==content, space-separated entries), so the tag is added that way.
meta=viewport==width=device-width,initial-scale=1
