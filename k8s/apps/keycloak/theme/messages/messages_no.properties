# Keys Keycloak 26's own Norwegian bundle leaves untranslated, so the login page
# does not read half in one language and half in the other. Only what actually
# falls back belongs here — everything absent from this file is Keycloak's own
# translation and should stay that way.
#
# Escaped rather than written in UTF-8: the file travels through a ConfigMap and
# a subPath mount, and an escape survives every encoding either of them might
# apply. `\u00e5` is å.
loginAccountTitle=Logg inn p\u00e5 kontoen din
