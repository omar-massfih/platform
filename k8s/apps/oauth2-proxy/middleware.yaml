# Two middlewares, and both are needed.
#
# forwardAuth asks oauth2-proxy whether the request carries a valid session. On
# success Traefik copies the named headers onto the request; on failure it
# returns 401 — which a browser would render as a blank error page.
#
# So `errors` catches that 401 and serves oauth2-proxy's sign-in page instead,
# which is what turns "denied" into "log in". Chained on the ingress with
# errors first, so it is in place to catch what forwardAuth produces.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.platform.svc:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Email
      - X-Auth-Request-Access-Token
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-signin
spec:
  errors:
    status:
      - "401"
    service:
      name: oauth2-proxy
      port: 4180
    query: /oauth2/start
