# Sits between Traefik and anything that needs a login. Traefik asks it whether
# a request is authenticated; it owns the redirect dance with Keycloak and the
# session cookie, so no application has to.
#
# Run in auth-only mode: `--upstream=static://202` means it never proxies
# traffic, it only answers yes or no. Traefik routes the real request itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels: { app: oauth2-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oauth2-proxy }
  template:
    metadata:
      labels: { app: oauth2-proxy }
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.omarmassfih.no/realms/platform
            # Keycloak users here have no email address, and inventing one to
            # satisfy the default claim would be worse than naming the real one.
            - --oidc-email-claim=preferred_username
            - --insecure-oidc-allow-unverified-email=true
            - --email-domain=*
            - --redirect-url=https://rpg.omarmassfih.no/oauth2/callback
            - --whitelist-domain=rpg.omarmassfih.no
            - --cookie-domain=rpg.omarmassfih.no
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=static://202
            - --set-xauthrequest=true
            # The application verifies this token itself rather than trusting a
            # header, so a pod inside the cluster cannot forge an identity.
            - --pass-access-token=true
            - --skip-provider-button=true
            - --silence-ping-logging=true
          envFrom:
            - secretRef:
                name: oauth2-proxy
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
