# Sits in the request path between Traefik and the app. It serves /oauth2/*
# itself and forwards everything else once a session exists, so the application
# never sees an unauthenticated request and never runs a login of its own.
#
# It is in the path rather than beside it deliberately. Traefik 2.11 can ask an
# auth service for a verdict, but its errors middleware answers a denial with
# the original 401 status — so the browser gets a Location header on a response
# it will not follow, and the flow dead-ends on a bare link. Proxying means the
# redirect is a real 302.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels: { app: oauth2-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oauth2-proxy }
  template:
    metadata:
      labels: { app: oauth2-proxy }
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.omarmassfih.no/realms/platform
            # Keycloak users here have no email address, and inventing one to
            # satisfy the default claim would be worse than naming the real one.
            - --oidc-email-claim=preferred_username
            - --insecure-oidc-allow-unverified-email=true
            - --email-domain=*
            - --redirect-url=https://rpg.omarmassfih.no/oauth2/callback
            - --whitelist-domain=rpg.omarmassfih.no
            # Sign-out hands the browser on to the provider to end the session
            # there too; without this the proxy refuses to send it.
            - --whitelist-domain=auth.omarmassfih.no
            - --cookie-domain=rpg.omarmassfih.no
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=http://rpg-system.platform.svc:8000
            - --set-xauthrequest=true
            # The application verifies this token itself rather than trusting a
            # header, so a pod inside the cluster cannot forge an identity.
            - --pass-access-token=true
            - --skip-provider-button=true
            - --silence-ping-logging=true
          envFrom:
            - secretRef:
                name: oauth2-proxy
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
