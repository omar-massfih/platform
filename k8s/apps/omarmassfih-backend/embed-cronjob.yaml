apiVersion: batch/v1
kind: CronJob
metadata:
  name: omarmassfih-backend-embed
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr
          containers:
            - name: embed-notes
              image: ghcr.io/omar-massfih/omarmassfih.no-backend
              imagePullPolicy: Always
              command: ["python", "scripts/embed_notes.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: pg-app, key: uri }
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                limits: { memory: 1Gi }
