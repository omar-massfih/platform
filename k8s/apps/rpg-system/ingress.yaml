# Traefik routes the host to oauth2-proxy, which serves /oauth2/* itself and
# forwards everything else to the application once a session exists. There is no
# unauthenticated path to the app: it is not the ingress backend at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpg-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [rpg.omarmassfih.no]
      secretName: rpg-system-tls
  rules:
    - host: rpg.omarmassfih.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: { name: http }
