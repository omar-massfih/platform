# Two routers on one host.
#
# /oauth2/* belongs to oauth2-proxy and must stay unauthenticated — it is where
# the sign-in page and the callback live, so guarding it would lock the door
# from the inside. Traefik matches the longer prefix first.
#
# Everything else is the application. The auth middlewares are commented out
# until oauth2-proxy is confirmed healthy: enabling them against a broken chain
# takes the site down rather than protecting it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpg-system-oauth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [rpg.omarmassfih.no]
      secretName: rpg-system-tls
  rules:
    - host: rpg.omarmassfih.no
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: { name: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpg-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Order matters: errors first, so it is in place to catch the 401 that
    # forwardAuth returns and turn it into the sign-in page.
    # traefik.ingress.kubernetes.io/router.middlewares: platform-oidc-signin@kubernetescrd,platform-oidc-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [rpg.omarmassfih.no]
      secretName: rpg-system-tls
  rules:
    - host: rpg.omarmassfih.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rpg-system
                port: { name: http }
