apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Keep storage identities so retiring workloads cannot erase data.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - agentic-pvcs.yaml
  - pr-pilot-pvcs.yaml
  - pr-pilot-omarmassfih-pvcs.yaml
  - garage-pvc.yaml
  - codex-auth-pvc.yaml
  - dagster-database.yaml
