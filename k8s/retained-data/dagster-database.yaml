# Dagster's run, event and schedule storage. A database of its own rather than
# a schema in `ingest`: dagster creates its tables in `public`, which in the
# ingest database already belongs to the notes backend.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dagster
spec:
  name: dagster
  owner: ingest # reuse the existing role; pg-app's credentials already grant it
  cluster:
    name: pg
