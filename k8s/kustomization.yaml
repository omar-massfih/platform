apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
# Flux reconciles this directory with pruning enabled.
resources:
  - platform/namespace.yaml
  - platform/postgres.yaml
  - apps/omarmassfih-backend
  - apps/rpg-system
  - apps/keycloak
  - apps/oauth2-proxy # RPG's authenticated ingress depends on this proxy.
  - retained-data # Offline data from retired services; no workloads.
images:
  - name: ghcr.io/omar-massfih/omarmassfih.no-backend
    newTag: "sha-2c178f3"
  - name: ghcr.io/omar-massfih/rpg-system
    newTag: "20260824015606-476267b" # {"$imagepolicy": "flux-system:rpg-system:tag"}
