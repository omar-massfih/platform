apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
# Reconciled by Flux (clusters/omar/flux-system). Only components with a published
# image are enabled. Uncomment each app as its image lands in ghcr (or is imported
# into containerd), then commit — Flux applies it automatically.
resources:
  - platform/namespace.yaml
  - platform/codex-auth-pvc.yaml
  - platform/postgres.yaml # CNPG Cluster; operator installed by 20-platform
  - apps/garage # S3-compatible landing zone for ingest; public image, no CI tag
  - apps/agentic-assistent
  - apps/chatgpt-proxy
  - apps/chatgpt-browser
  - apps/pr-pilot
  - apps/pr-pilot-omarmassfih
  - apps/ingest # dlt orchestrator (Deployment); tag bumped by ingest CI
  - apps/omarmassfih-backend # notes/chat API; authored notes seed into Postgres at startup
  - apps/rpg-system # rank tracker; own `rpg` database, API + static UI in one image
  - apps/keycloak # platform SSO; own `keycloak` database, admin creds out of band
  - apps/oauth2-proxy # ForwardAuth for Traefik; owns the OIDC dance for every app
# All images pulled from ghcr, pinned to a build tag. Bump these (and push new
# images) to roll out a new version; Flux applies the change.
images:
  - name: ghcr.io/omar-massfih/agentic-assistent
    newTag: "sha-ada0c31"
  - name: ghcr.io/omar-massfih/chatgpt-proxy
    newTag: "20260720"
  - name: ghcr.io/omar-massfih/chatgpt-browser
    newTag: "20260720f"
  - name: ghcr.io/omar-massfih/pr-pilot
    newTag: "20260730d"
  - name: ghcr.io/omar-massfih/ingest
    newTag: "sha-44ebacb" # bumped to a sha- tag by ingest CI on first push
  - name: ghcr.io/omar-massfih/omarmassfih.no-backend
    newTag: "sha-2c178f3"
  # rpg-system's tag is set by Flux image automation; see flux/README.md.
  - name: ghcr.io/omar-massfih/rpg-system
    newTag: "20260823150417-febfafa" # {"$imagepolicy": "flux-system:rpg-system:tag"}
