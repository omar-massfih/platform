apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied by its own Flux Kustomization (`flux-images` in flux-system), NOT by
# ../kustomization.yaml. That one sets `namespace: platform`, and kustomize's
# namespace transformer overrides the namespace a resource declares for itself —
# so listing this directory there silently moved all three objects into
# `platform`, where the ImageUpdateAutomation could no longer see the
# GitRepository it references and failed with "does not exist".
#
# The objects have to sit beside the GitRepository they name. A cross-namespace
# sourceRef is not a thing.
resources:
  - rpg-system.yaml
  - image-automation.yaml
